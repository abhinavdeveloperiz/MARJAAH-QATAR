<style>
  #cart-overlay {
    transition: opacity 0.3s ease;
  }
  #cart-overlay.is-active {
    opacity: 1 !important;
    pointer-events: auto !important;
  }
  #cart-drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    z-index: 120;
    width: 100%;
    max-width: 420px;
    background: var(--bg-surface);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  html:not([dir="rtl"]) #cart-drawer {
    right: 0 !important;
    left: auto !important;
    transform: translateX(100%);
  }
  html[dir="rtl"] #cart-drawer {
    left: 0 !important;
    right: auto !important;
    transform: translateX(-100%);
  }
  #cart-drawer.is-open {
    transform: translateX(0) !important;
  }
</style>

<!-- Cart Drawer Overlay -->
<div id="cart-overlay" class="fixed inset-0 z-[115] bg-black/75 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300" onclick="if(window.closeCart)window.closeCart();"></div>

<!-- Cart Drawer -->
<div id="cart-drawer" class="flex flex-col h-full shadow-2xl overflow-hidden">

  <!-- Header -->
  <div class="flex items-center justify-between px-5 py-4 border-b flex-shrink-0" style="border-color:var(--border-color, rgba(255,255,255,0.08));background:var(--bg-surface)">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center bg-primary-500/10 text-primary-400">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" x2="21" y1="6" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-bold text-sm tracking-wide" style="color:var(--text-primary)">
          {% if is_rtl %}سلة التسوق{% else %}Shopping Cart{% endif %}
        </span>
        <span class="inline-flex items-center justify-center min-w-[20px] h-5 px-1.5 rounded-full text-xs font-bold bg-primary-500/20 text-primary-400" data-drawer-count>{{ cart_count }}</span>
      </div>
    </div>
    <button data-close-cart onclick="if(window.closeCart)window.closeCart();" aria-label="{{ t.common.close|default:'Close' }}" class="w-8 h-8 rounded-lg flex items-center justify-center cursor-pointer transition-all hover:bg-white/10" style="color:var(--text-secondary)">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>

  <!-- Dynamic Content (Items + Immediate Checkout Footer) -->
  <div id="cart-drawer-content" class="flex-1 flex flex-col min-h-0 overflow-hidden">
    {% include 'partials/cart_drawer_partial.html' %}
  </div>
</div>
