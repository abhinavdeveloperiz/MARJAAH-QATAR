  <circle cx="400" cy="220" r="80" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.5" />
  <path d="M224 290 C 320 220, 480 320, 576 250 L 576 336 L 224 336 Z" fill="#001428" opacity="0.6" />

  <ellipse cx="400" cy="460" rx="270" ry="16" fill="#000000" opacity="0.6" />

