<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgCharger" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgCharger)" rx="20" />
  <circle cx="300" cy="200" r="130" fill="#38BDF8" opacity="0.1" />
  <!-- Fast Charger Body -->
  <rect x="230" y="130" width="140" height="150" rx="24" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
  <!-- USB-C Ports -->
  <rect x="260" y="165" width="80" height="18" rx="9" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <rect x="260" y="200" width="80" height="18" rx="9" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <!-- USB-A Port -->
  <rect x="255" y="235" width="90" height="24" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <!-- Lightning indicator -->
  <path d="M295 105 L310 105 L300 125 L315 125 L285 160 L295 133 L285 133 Z" fill="#38BDF8" opacity="0.9" />
  <!-- Prongs -->
  <rect x="260" y="280" width="20" height="35" rx="4" fill="#64748B" />
  <rect x="320" y="280" width="20" height="35" rx="4" fill="#64748B" />
  <text x="300" y="375" fill="#FFFFFF" font-size="20" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">FAST CHARGERS</text>
</svg>
