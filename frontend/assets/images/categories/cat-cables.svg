  <rect x="275" y="90" width="22" height="36" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="3" />
  <rect x="281" y="80" width="10" height="10" rx="3" fill="#64748B" />
  <rect x="305" y="250" width="22" height="36" rx="6" fill="#0F172A" stroke="#34D399" stroke-width="3" />
  <rect x="311" y="286" width="10" height="10" rx="3" fill="#64748B" />
  <text x="300" y="375" fill="#FFFFFF" font-size="20" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="2">CABLES &amp; HUBS</text>
