<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | M.SHOP Qatar</title>
  <meta name="description" content="The page you are looking for does not exist on M.SHOP Qatar." />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/branding/favicon.png?v=4" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/branding/favicon.svg?v=4" />
  <link rel="shortcut icon" href="/assets/images/branding/favicon.ico?v=4" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#4063B2', 500: '#4063B2', 600: '#36529A' },
            accent: { DEFAULT: '#8D9CF5' },
          },
          fontFamily: {
            display: ["'Space Grotesk'", 'Outfit', 'sans-serif'],
            sans: ['Inter', 'Outfit', 'system-ui', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/assets/css/globals.css" />
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-primary-500 selection:text-white" style="background:var(--bg-base);color:var(--text-primary);">

  <!-- Minimal Header -->
  <header class="w-full border-b backdrop-blur-md px-6 py-4 flex items-center justify-between" style="border-color:var(--border-color);background:rgba(7,11,20,0.8);">
    <a href="/" class="flex items-center gap-3">
      <img src="/assets/images/branding/logo.svg" alt="M.SHOP" class="h-8 w-auto" onerror="this.onerror=null;this.src='/apple-touch-icon.png'" />
      <span class="font-display font-extrabold tracking-wider text-lg uppercase bg-gradient-to-r from-blue-400 via-indigo-300 to-purple-400 bg-clip-text text-transparent">M.SHOP</span>
    </a>
    <div class="flex items-center gap-4">
      <a href="/" class="text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-white transition">Home</a>
      <a href="/shop/" class="text-xs font-bold uppercase tracking-wider text-slate-400 hover:text-white transition">Catalog</a>
    </div>
  </header>

  <!-- Error Content -->
  <main class="flex-1 flex items-center justify-center px-4 py-16 sm:py-24 text-center">
    <div class="max-w-lg w-full flex flex-col items-center">
      <!-- Glow Badge -->
      <div class="relative mb-6">
        <div class="absolute -inset-4 bg-gradient-to-r from-indigo-500/20 to-blue-500/20 rounded-full blur-2xl"></div>
        <span class="relative text-7xl sm:text-9xl font-display font-black tracking-tight bg-gradient-to-br from-indigo-400 via-blue-300 to-slate-500 bg-clip-text text-transparent">404</span>
      </div>

      <h1 class="text-2xl sm:text-3xl font-display font-bold tracking-tight mb-3">Page Not Found</h1>
      <p class="text-sm sm:text-base max-w-md mb-8 text-slate-400">
        The link you followed may be broken, or the page may have been removed or moved to a new address.
      </p>

      <!-- Quick Search Bar -->
      <form method="get" action="/shop/" class="w-full max-w-md mb-8">
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input name="search" type="text" placeholder="Search laptops, GPUs, RAM, accessories..."
            class="w-full pl-11 pr-24 py-3 rounded-xl border text-xs sm:text-sm focus:outline-none transition-colors"
            style="background:var(--bg-surface-2);border-color:var(--border-color);color:var(--text-primary);" />
          <button type="submit" class="btn-primary absolute right-1.5 top-1/2 -translate-y-1/2 py-1.5 px-4 rounded-lg text-xs font-bold">Search</button>
        </div>
      </form>

      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center justify-center gap-3">
        <a href="/shop/" class="btn-primary px-6 py-2.5 rounded-xl text-xs font-bold inline-flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Explore Catalog
        </a>
        <a href="/" class="btn-ghost px-6 py-2.5 rounded-xl text-xs font-bold inline-flex items-center gap-2 border" style="border-color:var(--border-color);color:var(--text-secondary)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Back to Homepage
        </a>
      </div>
    </div>
  </main>

  <!-- Footer note -->
  <footer class="w-full border-t py-4 text-center text-xs text-slate-500" style="border-color:var(--border-color);">
    &copy; 2026 M.SHOP Qatar. High-Performance Hardware. All rights reserved.
  </footer>

</body>
</html>
