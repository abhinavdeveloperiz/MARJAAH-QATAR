<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="100%" stop-color="#070B14" />
    </radialGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D9CF5" />
      <stop offset="100%" stop-color="#4063B2" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="rgbBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0055" />
      <stop offset="25%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="75%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="24" />

  <!-- Ambient Glow Behind Laptop -->
  <circle cx="400" cy="280" r="180" fill="#8D9CF5" opacity="0.12" filter="url(#glow)" />
  <circle cx="460" cy="260" r="140" fill="#FF007A" opacity="0.08" filter="url(#glow)" />

  <!-- Grid lines -->
  <path d="M100 480 L700 480 M150 510 L650 510 M200 540 L600 540" stroke="#8D9CF5" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Laptop Screen Outer Lid -->
  <rect x="220" y="110" width="360" height="230" rx="14" fill="#0A0F1D" stroke="#1E293B" stroke-width="3" />
  
  <!-- Screen Bezel & Display -->
  <rect x="230" y="120" width="340" height="210" rx="8" fill="url(#screenGrad)" />
  
  <!-- ROG Display Graphics -->
  <path d="M350 200 L450 200 L410 250 Z" fill="url(#neonGlow)" opacity="0.6" />
  <circle cx="400" cy="210" r="45" stroke="#8D9CF5" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M260 280 Q 400 180 540 280" stroke="url(#neonGlow)" stroke-width="3" fill="none" opacity="0.7" />
  
  <!-- Laptop Camera & Logo -->
  <circle cx="400" cy="116" r="2.5" fill="#38BDF8" opacity="0.8" />
  <text x="400" y="324" fill="#64748B" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="3">ROG STRIX</text>

  <!-- Laptop Base/Keyboard Deck -->
  <!-- Base Shadow -->
  <ellipse cx="400" cy="460" rx="280" ry="18" fill="#000000" opacity="0.5" />
  
  <!-- Base Chassis -->
  <polygon points="150,440 210,340 590,340 650,440" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
  <polygon points="146,440 654,440 644,454 156,454" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />

  <!-- RGB Lightbar at Front -->
  <line x1="180" y1="448" x2="620" y2="448" stroke="url(#rgbBar)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />

  <!-- Keyboard Area -->
  <polygon points="230,350 570,350 550,410 250,410" fill="#070B14" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Individual Key Matrix Representation -->
  <g opacity="0.85">
    <rect x="255" y="356" width="28" height="8" rx="2" fill="#8D9CF5" opacity="0.7" />
    <rect x="288" y="356" width="28" height="8" rx="2" fill="#8D9CF5" opacity="0.7" />
    <rect x="321" y="356" width="28" height="8" rx="2" fill="#38BDF8" opacity="0.7" />
    <rect x="354" y="356" width="28" height="8" rx="2" fill="#38BDF8" opacity="0.7" />
    <rect x="387" y="356" width="28" height="8" rx="2" fill="#BB9AED" opacity="0.7" />
    <rect x="420" y="356" width="28" height="8" rx="2" fill="#BB9AED" opacity="0.7" />
    <rect x="453" y="356" width="28" height="8" rx="2" fill="#F43F5E" opacity="0.7" />
    <rect x="486" y="356" width="28" height="8" rx="2" fill="#F43F5E" opacity="0.7" />
    <rect x="519" y="356" width="24" height="8" rx="2" fill="#F59E0B" opacity="0.7" />

    <!-- Row 2 -->
    <rect x="252" y="369" width="30" height="9" rx="2" fill="#8D9CF5" opacity="0.8" />
    <rect x="287" y="369" width="26" height="9" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="318" y="369" width="26" height="9" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="349" y="369" width="26" height="9" rx="2" fill="#BB9AED" opacity="0.8" />
    <rect x="380" y="369" width="26" height="9" rx="2" fill="#BB9AED" opacity="0.8" />
    <rect x="411" y="369" width="26" height="9" rx="2" fill="#F43F5E" opacity="0.8" />
    <rect x="442" y="369" width="26" height="9" rx="2" fill="#F43F5E" opacity="0.8" />
    <rect x="473" y="369" width="26" height="9" rx="2" fill="#F59E0B" opacity="0.8" />
    <rect x="504" y="369" width="38" height="9" rx="2" fill="#10B981" opacity="0.8" />

    <!-- WASD Highlight -->
    <rect x="282" y="383" width="28" height="10" rx="2" fill="#FFFFFF" stroke="#00F0FF" stroke-width="1.5" />
    <rect x="315" y="383" width="28" height="10" rx="2" fill="#FFFFFF" stroke="#00F0FF" stroke-width="1.5" />
    <rect x="348" y="383" width="28" height="10" rx="2" fill="#BB9AED" opacity="0.8" />
    <rect x="381" y="383" width="28" height="10" rx="2" fill="#BB9AED" opacity="0.8" />
    <rect x="414" y="383" width="28" height="10" rx="2" fill="#F43F5E" opacity="0.8" />
    <rect x="447" y="383" width="28" height="10" rx="2" fill="#F59E0B" opacity="0.8" />
    <rect x="480" y="383" width="60" height="10" rx="2" fill="#10B981" opacity="0.8" />

    <!-- Spacebar Row -->
    <rect x="340" y="398" width="120" height="8" rx="2" fill="#8D9CF5" opacity="0.9" />
  </g>

  <!-- Glass Trackpad -->
  <rect x="350" y="416" width="100" height="20" rx="3" fill="#1E293B" stroke="#334155" stroke-width="1" opacity="0.7" />

  <!-- Brand badge -->
  <rect x="660" y="40" width="100" height="28" rx="14" fill="#141E33" stroke="#8D9CF5" stroke-width="1" />
  <text x="710" y="58" fill="#8D9CF5" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">ASUS ROG</text>
</svg>
