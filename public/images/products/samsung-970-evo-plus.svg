<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>
    <linearGradient id="goldPins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="nandChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="24" />
  <circle cx="400" cy="300" r="180" fill="#EF4444" opacity="0.1" />

  <!-- Shadow -->
  <rect x="180" y="270" width="460" height="150" rx="10" fill="#000000" opacity="0.6" transform="rotate(-8 400 300)" />

  <!-- M.2 2280 PCB Board (Rotated slightly for dynamic 3D feel) -->
  <g transform="rotate(-8 400 300)">
    <!-- Black PCB -->
    <rect x="160" y="220" width="480" height="150" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2" />

    <!-- Mounting Semi-Circle Notch (Left End) -->
    <path d="M160 280 A 15 15 0 0 1 160 310 Z" fill="#05070D" />
    <circle cx="165" cy="295" r="12" fill="none" stroke="#64748B" stroke-width="1.5" />

    <!-- Gold Pin Connector (Right End) with M-Key Notch -->
    <rect x="625" y="235" width="15" height="120" rx="2" fill="url(#goldPins)" />
    <!-- M-Key Gap -->
    <rect x="624" y="270" width="17" height="14" fill="#0F172A" />

    <!-- Copper Traces Representation -->
    <path d="M220 240 L300 240 L320 260" stroke="#F59E0B" stroke-width="0.8" fill="none" opacity="0.4" />
    <path d="M220 350 L340 350 L360 330" stroke="#F59E0B" stroke-width="0.8" fill="none" opacity="0.4" />

    <!-- Phoenix Controller Chip (Silver Heatspreader) -->
    <rect x="220" y="245" width="80" height="80" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <text x="260" y="282" fill="#0F172A" font-size="9" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="1">SAMSUNG</text>
    <text x="260" y="296" fill="#334155" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">PHOENIX</text>

    <!-- Samsung V-NAND Flash Chips (Black with Orange EVO Plus Branding) -->
    <rect x="330" y="240" width="110" height="110" rx="4" fill="url(#nandChip)" stroke="#334155" stroke-width="1" />
    <rect x="460" y="240" width="110" height="110" rx="4" fill="url(#nandChip)" stroke="#334155" stroke-width="1" />

    <!-- EVO Plus Graphic Label Overlay -->
    <rect x="335" y="270" width="230" height="50" rx="3" fill="#090D16" stroke="#EF4444" stroke-width="1.5" />
    <text x="350" y="300" fill="#FFFFFF" font-size="16" font-family="sans-serif" font-weight="900" letter-spacing="1">970 EVO</text>
    <text x="445" y="300" fill="#F97316" font-size="16" font-family="sans-serif" font-weight="900">Plus</text>
    <text x="520" y="300" fill="#38BDF8" font-size="12" font-family="sans-serif" font-weight="bold">1TB</text>
    <text x="350" y="314" fill="#94A3B8" font-size="7" font-family="sans-serif" font-weight="bold" letter-spacing="1">NVMe M.2 V-NAND SSD</text>
  </g>

  <!-- Speed Badge -->
  <rect x="630" y="40" width="130" height="28" rx="14" fill="#0F172A" stroke="#F97316" stroke-width="1" />
  <text x="695" y="58" fill="#F97316" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">3500 MB/s</text>
</svg>
