<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>
    <linearGradient id="thinkScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="24" />
  <circle cx="400" cy="270" r="160" fill="#EF4444" opacity="0.08" />

  <!-- Screen Lid (Matte Black Carbon Fiber) -->
  <rect x="220" y="110" width="360" height="230" rx="6" fill="#18181B" stroke="#27272A" stroke-width="2" />
  <rect x="228" y="118" width="344" height="214" rx="4" fill="url(#thinkScreen)" />

  <!-- Display graphics -->
  <circle cx="400" cy="225" r="50" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.6" />
  <line x1="330" y1="225" x2="470" y2="225" stroke="#94A3B8" stroke-width="1.5" opacity="0.4" />
  <text x="400" y="230" fill="#FFFFFF" font-size="12" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="3">THINKPAD</text>

  <!-- Laptop Base (Matte Black) -->
  <ellipse cx="400" cy="460" rx="270" ry="16" fill="#000000" opacity="0.6" />
  <polygon points="160,440 215,340 585,340 640,440" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
  <polygon points="156,440 644,440 636,452 164,452" fill="#09090B" stroke="#27272A" stroke-width="1.5" />

  <!-- Keyboard Well -->
  <polygon points="235,350 565,350 550,410 250,410" fill="#09090B" stroke="#27272A" stroke-width="1" />
  <rect x="255" y="356" width="290" height="42" rx="3" fill="#18181B" opacity="0.8" />

  <!-- Iconic Red TrackPoint Dot (Center of Keyboard) -->
  <circle cx="400" cy="378" r="4.5" fill="#EF4444" stroke="#DC2626" stroke-width="1" />

  <!-- TrackPoint Buttons (3 Buttons above Trackpad with Red Stripes) -->
  <rect x="370" y="412" width="18" height="8" rx="2" fill="#27272A" />
  <rect x="390" y="412" width="20" height="8" rx="2" fill="#27272A" stroke="#EF4444" stroke-width="1" />
  <rect x="412" y="412" width="18" height="8" rx="2" fill="#27272A" />

  <!-- Trackpad -->
  <rect x="360" y="422" width="80" height="16" rx="2" fill="#18181B" stroke="#27272A" stroke-width="1" />

  <!-- ThinkPad Logo with Red Dot on 'i' (Bottom Right Palmrest) -->
  <text x="590" y="432" fill="#E4E4E7" font-size="10" font-family="sans-serif" font-weight="900" transform="rotate(-30 590 432)">ThinkPad</text>
  <circle cx="616" cy="416" r="2" fill="#EF4444" />

  <!-- Spec Badge -->
  <rect x="630" y="40" width="130" height="28" rx="14" fill="#18181B" stroke="#EF4444" stroke-width="1" />
  <text x="695" y="58" fill="#EF4444" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">1.12 KG</text>
</svg>
