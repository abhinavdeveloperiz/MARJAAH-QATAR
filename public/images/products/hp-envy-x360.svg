<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161E2E" />
      <stop offset="100%" stop-color="#07090F" />
    </radialGradient>
    <linearGradient id="silverLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="touchOled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="24" />
  <circle cx="400" cy="280" r="170" fill="#A855F7" opacity="0.12" />

  <!-- Convertible 360 Hinge Tent Mode / Laptop representation -->
  <ellipse cx="400" cy="460" rx="270" ry="16" fill="#000000" opacity="0.5" />

  <!-- Screen Deck (OLED Touchscreen with pen canvas) -->
  <rect x="230" y="110" width="340" height="230" rx="10" fill="#1E293B" stroke="url(#silverLid)" stroke-width="2" />
  <rect x="238" y="118" width="324" height="214" rx="6" fill="url(#touchOled)" />

  <!-- Touch Drawing Curve on Display -->
  <path d="M260 280 Q 340 180 440 250 T 540 190" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9" />
  <circle cx="540" cy="190" r="6" fill="#00F0FF" />

  <!-- Silver Base Deck -->
  <polygon points="170,440 220,340 580,340 630,440" fill="#334155" stroke="url(#silverLid)" stroke-width="1.5" />
  <polygon points="166,440 634,440 626,452 174,452" fill="#1E293B" stroke="#0F172A" stroke-width="1.5" />
  <rect x="240" y="350" width="320" height="55" rx="3" fill="#1E293B" opacity="0.7" />

  <!-- Active Stylus Pen (Floating on side) -->
  <g transform="rotate(35 560 280)">
    <rect x="540" y="200" width="10" height="150" rx="4" fill="url(#silverLid)" stroke="#475569" stroke-width="1" />
    <polygon points="540,350 550,350 545,365" fill="#0F172A" />
    <rect x="542" y="270" width="6" height="18" rx="2" fill="#38BDF8" />
  </g>

  <!-- Spec Badge -->
  <rect x="630" y="40" width="130" height="28" rx="14" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
  <text x="695" y="58" fill="#A855F7" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">OLED TOUCH</text>
</svg>
