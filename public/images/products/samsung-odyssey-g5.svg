<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyberScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="40%" stop-color="#112240" />
      <stop offset="70%" stop-color="#006699" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="24" />

  <!-- Ambient Glow Behind Curved Monitor -->
  <circle cx="400" cy="240" r="200" fill="#00F0FF" opacity="0.12" />

  <!-- Monitor Stand Base (V-Shape Gaming Stand) -->
  <polygon points="400,430 400,470 280,510 310,510 400,450 490,510 520,510 400,470" fill="#1E293B" stroke="#334155" stroke-width="2" />
  <!-- Stand Neck -->
  <polygon points="385,320 415,320 410,450 390,450" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
  <circle cx="400" cy="360" r="16" fill="#00F0FF" opacity="0.8" />
  <circle cx="400" cy="360" r="22" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.4" />

  <!-- 1000R Curved Screen Chassis (Curved polygon representation) -->
  <!-- Top Curve: 120,160 to 680,160 dipping slightly at center (400, 175) -->
  <!-- Bottom Curve: 120,380 to 680,380 dipping at center (400, 395) -->
  <path d="M 120 160 Q 400 185 680 160 L 680 375 Q 400 400 120 375 Z" fill="#0A0F1D" stroke="#334155" stroke-width="3" />

  <!-- Screen Content Area (Bezel-less) -->
  <path d="M 128 168 Q 400 191 672 168 L 672 367 Q 400 390 128 367 Z" fill="url(#cyberScreen)" />

  <!-- Curved Screen Game Graphics -->
  <path d="M 128 320 Q 400 370 672 260 L 672 367 Q 400 390 128 367 Z" fill="#001428" opacity="0.7" />
  <circle cx="400" cy="270" r="45" fill="none" stroke="#00F0FF" stroke-width="3" opacity="0.8" />
  <circle cx="400" cy="270" r="20" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.9" />
  <line x1="330" y1="270" x2="470" y2="270" stroke="#00F0FF" stroke-width="1.5" opacity="0.7" />
  <line x1="400" y1="200" x2="400" y2="340" stroke="#00F0FF" stroke-width="1.5" opacity="0.7" />

  <!-- Odyssey Gaming Core Light (Bottom) -->
  <path d="M 370 393 Q 400 397 430 393" stroke="url(#neonCyan)" stroke-width="4" fill="none" />

  <!-- Spec Badges -->
  <rect x="640" y="40" width="120" height="28" rx="14" fill="#0F172A" stroke="#00F0FF" stroke-width="1" />
  <text x="700" y="58" fill="#00F0FF" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">165Hz WQHD</text>
</svg>
