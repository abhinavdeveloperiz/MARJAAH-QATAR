<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#112233" />
      <stop offset="100%" stop-color="#040911" />
    </radialGradient>
    <linearGradient id="towerWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="40%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" rx="24" />
  <circle cx="400" cy="300" r="180" fill="#38BDF8" opacity="0.12" />

  <!-- WiFi Waves Graphic Overhead -->
  <path d="M 320 140 Q 400 80 480 140" stroke="#38BDF8" stroke-width="3" fill="none" opacity="0.3" stroke-linecap="round" />
  <path d="M 345 165 Q 400 120 455 165" stroke="#38BDF8" stroke-width="3.5" fill="none" opacity="0.6" stroke-linecap="round" />
  <path d="M 370 190 Q 400 160 430 190" stroke="#00F0FF" stroke-width="4" fill="none" opacity="0.9" stroke-linecap="round" />

  <!-- Shadow for Towers -->
  <ellipse cx="280" cy="460" rx="60" ry="16" fill="#000000" opacity="0.5" />
  <ellipse cx="520" cy="460" rx="60" ry="16" fill="#000000" opacity="0.5" />
  <ellipse cx="400" cy="480" rx="80" ry="20" fill="#000000" opacity="0.7" />

  <!-- Background Left Tower -->
  <g transform="scale(0.85) translate(110, 80)">
    <path d="M240 240 C 240 220, 320 220, 320 240 L 320 440 C 320 455, 240 455, 240 440 Z" fill="url(#towerWhite)" opacity="0.75" />
    <ellipse cx="280" cy="240" rx="40" ry="10" fill="#E2E8F0" />
    <circle cx="280" cy="435" r="3" fill="#38BDF8" />
  </g>

  <!-- Background Right Tower -->
  <g transform="scale(0.85) translate(310, 80)">
    <path d="M240 240 C 240 220, 320 220, 320 240 L 320 440 C 320 455, 240 455, 240 440 Z" fill="url(#towerWhite)" opacity="0.75" />
    <ellipse cx="280" cy="240" rx="40" ry="10" fill="#E2E8F0" />
    <circle cx="280" cy="435" r="3" fill="#38BDF8" />
  </g>

  <!-- Hero Center Tower -->
  <!-- Top Vent Black Cap with Swirl -->
  <path d="M340 220 C 340 200, 460 200, 460 220 L 460 460 C 460 480, 340 480, 340 460 Z" fill="url(#towerWhite)" stroke="#E2E8F0" stroke-width="1.5" />
  <ellipse cx="400" cy="220" rx="60" ry="15" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
  <ellipse cx="400" cy="220" rx="45" ry="10" fill="#020617" />
  <circle cx="400" cy="220" r="15" fill="#0F172A" />

  <!-- TP-Link Deco Logo Impression -->
  <text x="400" y="320" fill="#64748B" font-size="14" font-family="sans-serif" font-weight="900" text-anchor="middle" letter-spacing="4">Deco</text>
  <text x="400" y="338" fill="#94A3B8" font-size="8" font-family="sans-serif" font-weight="bold" text-anchor="middle">WiFi 6E</text>

  <!-- Status LED at Base (Glowing Cyan) -->
  <circle cx="400" cy="450" r="4" fill="#00F0FF" />
  <circle cx="400" cy="450" r="8" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.5" />

  <!-- Spec Badge -->
  <rect x="630" y="40" width="130" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
  <text x="695" y="58" fill="#38BDF8" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle" letter-spacing="1">TRI-BAND 6E</text>
</svg>
